<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header>Faça login Abaixo:</header>
    <nav>
        <a href="index.html">Voltar para página inicial</a>

    </nav>
    <main>
        <section>
                <form>
        <p>
            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="senha">Crie uma senha:</label>

            <input
                type="password"
                id="senha"
                name="senha"
                required
            >
        </p>

        <button type="submit">
            <a href="index.html">Realizar login</a>
        </button>

    </form>
        </section>
    </main>
</body>
</html>
